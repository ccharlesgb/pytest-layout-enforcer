[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[project]
name = "pytest-layout-enforcer"
version = "0.1.0"
description = "Keep Python test layouts in sync with package layouts."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Connor Charles" }]
classifiers = [
    "Framework :: Pytest",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["pytest>=8"]

[project.scripts]
pytest-layout-enforcer = "pytest_layout_enforcer.cli:main"

[project.entry-points.pytest11]
layout-enforcer = "pytest_layout_enforcer.plugin"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.pytest-layout-enforcer]

[[tool.pytest-layout-enforcer.layouts]]
source = "src/pytest_layout_enforcer"
tests = "tests"
